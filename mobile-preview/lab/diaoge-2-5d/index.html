<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>雕哥 2.5D Rig v06</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b10;color:#eaf2ff;
font-family:Inter,system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
body{
  background:
  radial-gradient(circle at 50% 35%,rgba(53,72,105,.22),transparent 32%),
  linear-gradient(180deg,#090b10,#0c0f16 60%,#17110e);
}
#app{width:100%;height:100%;position:relative;display:grid;place-items:center}
.stage-wrap{position:relative;width:min(86vh,78vw);aspect-ratio:1;perspective:1100px;}
.stage{position:absolute;inset:0;transform-style:preserve-3d}
.layer{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
#base{z-index:1}
#headRig{
 position:absolute;inset:0;z-index:4;transform-origin:51.35% 55.8%;
 transform-style:preserve-3d;will-change:transform;pointer-events:none;
}
#head{z-index:1}

.eye-zone{position:absolute;z-index:3;overflow:visible;pointer-events:none}
.eye-zone.left{left:41.95%;top:35.40%;width:7.02%;height:7.66%}
.eye-zone.right{left:55.66%;top:36.45%;width:5.90%;height:6.86%}
.eyeball{
 position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
 transform-origin:50% 50%;will-change:transform;filter:saturate(1.06) contrast(1.02);
}
.lid{
 position:absolute;left:7%;right:7%;z-index:6;pointer-events:none;
 transform:scaleY(0);opacity:0;will-change:transform,opacity;
}
.left .lid.top{top:7%;height:48%;transform-origin:50% 0;
 background:linear-gradient(145deg,#e9eef7 0%,#aebbd0 62%,#74849e 100%);
 clip-path:polygon(0 0,100% 0,90% 72%,55% 100%,12% 75%);}
.left .lid.bottom{bottom:5%;height:40%;transform-origin:50% 100%;
 background:linear-gradient(25deg,#75849b,#c5cfdd);
 clip-path:polygon(8% 28%,55% 0,94% 26%,100% 100%,0 100%);}
.right .lid.top{top:8%;height:47%;transform-origin:50% 0;
 background:linear-gradient(155deg,#e8e9e7 0%,#beb6b0 62%,#7e7a84 100%);
 clip-path:polygon(0 0,100% 0,88% 74%,48% 100%,10% 70%);}
.right .lid.bottom{bottom:5%;height:39%;transform-origin:50% 100%;
 background:linear-gradient(30deg,#726f7d,#c9c2bd);
 clip-path:polygon(8% 28%,48% 0,94% 28%,100% 100%,0 100%);}

.eye-zone.blinking .eyeball{transition:transform 85ms ease-in;transform:translate(var(--gx,0px),var(--gy,0px)) scaleY(.08)!important}
.eye-zone.blinking .lid{transition:transform 90ms ease-in,opacity 45ms linear;transform:scaleY(1);opacity:1}
.eye-zone.opening .eyeball{transition:transform 110ms ease-out}
.eye-zone.opening .lid{transition:transform 110ms ease-out,opacity 80ms linear;transform:scaleY(0);opacity:0}

.toolbar{
 position:absolute;left:22px;bottom:22px;z-index:20;width:320px;padding:16px 17px;
 background:rgba(9,12,18,.72);border:1px solid rgba(255,255,255,.11);border-radius:18px;
 backdrop-filter:blur(14px);box-shadow:0 20px 60px rgba(0,0,0,.28)
}
.kicker{font-size:10px;font-weight:800;letter-spacing:.18em;color:#86d9ff;margin-bottom:7px}
.title{font-size:18px;font-weight:800;margin-bottom:7px}
.desc{font-size:11px;line-height:1.55;color:#9faabd}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button{
 border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#eef5ff;
 border-radius:999px;padding:8px 11px;font-size:11px;cursor:pointer
}
button:hover{background:rgba(255,255,255,.1)}
button.on{background:#edf5ff;color:#182132}
.badge{
 position:absolute;right:22px;top:22px;z-index:20;font-size:10px;letter-spacing:.14em;color:#8d9bb1;
 padding:9px 12px;border:1px solid rgba(255,255,255,.10);border-radius:999px;background:rgba(8,10,15,.48)
}
.hint{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);z-index:15;
font-size:10px;letter-spacing:.1em;color:#78869a;white-space:nowrap}
@media(max-width:800px){
 .stage-wrap{width:min(96vw,78vh)}
 .toolbar{left:12px;right:12px;bottom:12px;width:auto}
 .badge{top:12px;right:12px}
 .hint{display:none}
}
</style>
</head>

 <div class="toolbar">
   <div class="kicker">先确认“活起来”而不是“动起来”</div>
   <div class="title">雕哥 · 基础 2.5D Rig</div>
   <div class="desc">只保留很轻的眼神和头部跟随。没有翅膀动画、没有飞行，先检查角色是否仍然是原来的雕哥。</div>
   <div class="controls">
     <button id="followBtn" class="on">鼠标跟随：开</button>
     <button id="blinkBtn">眨一下</button>
     <button id="headBtn" class="on">头部轻动：开</button>
     <button id="resetBtn">回正</button>
   </div>
 </div>
 <div class="hint">移动鼠标看眼神 · 点击角色也会眨眼 · 动作故意很小</div>
</div>

<script>
(() => {
 const wrap=document.getElementById('stageWrap');
 const headRig=document.getElementById('headRig');
 const eyeL=document.getElementById('eyeL'), eyeR=document.getElementById('eyeR');
 const ballL=document.getElementById('ballL'), ballR=document.getElementById('ballR');

 let follow=true, headFollow=true, blinking=false;
 let tx=0,ty=0, hx=0,hy=0, ex=0,ey=0;
 let lastMove=performance.now();

 function setPointer(clientX,clientY){
   const r=wrap.getBoundingClientRect();
   let nx=((clientX-r.left)/r.width-.5)*2;
   let ny=((clientY-r.top)/r.height-.5)*2;
   nx=Math.max(-1,Math.min(1,nx)); ny=Math.max(-1,Math.min(1,ny));
   tx=nx; ty=ny; lastMove=performance.now();
 }
 window.addEventListener('pointermove',e=>{ if(follow) setPointer(e.clientX,e.clientY); });
 document.addEventListener('mouseleave',()=>{tx=0;ty=0});
 wrap.addEventListener('pointerdown',()=>blink());

 function blink(){
   if(blinking) return;
   blinking=true;
   [eyeL,eyeR].forEach(e=>{e.classList.remove('opening');e.classList.add('blinking')});
   setTimeout(()=>{
      [eyeL,eyeR].forEach(e=>{e.classList.remove('blinking');e.classList.add('opening')});
      setTimeout(()=>{[eyeL,eyeR].forEach(e=>e.classList.remove('opening')); blinking=false},130);
   },105);
 }
 function scheduleBlink(){
   const delay=2900+Math.random()*3200;
   setTimeout(()=>{blink();scheduleBlink()},delay);
 }
 scheduleBlink();

 function frame(){
   // Eyes react first.
   ex += ((follow?tx:0)-ex)*.16;
   ey += ((follow?ty:0)-ey)*.16;

   // Head deliberately lags behind.
   hx += ((headFollow&&follow?tx:0)-hx)*.055;
   hy += ((headFollow&&follow?ty:0)-hy)*.055;

   const scale=wrap.clientWidth/1254;
   const gx=ex*4.0*scale, gy=ey*2.6*scale;
   ballL.style.setProperty('--gx',gx+'px'); ballL.style.setProperty('--gy',gy+'px');
   ballR.style.setProperty('--gx',gx*0.88+'px'); ballR.style.setProperty('--gy',gy*0.9+'px');
   if(!blinking){
      ballL.style.transform=`translate(${gx}px,${gy}px)`;
      ballR.style.transform=`translate(${gx*.88}px,${gy*.9}px)`;
   }

   const px=hx*2.4*scale, py=hy*1.0*scale;
   const rz=hx*.72, ry=hx*2.0, rx=-hy*.85;
   headRig.style.transform=headFollow
     ? `translate3d(${px}px,${py}px,1px) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg)`
     : 'translate3d(0,0,1px)';

   requestAnimationFrame(frame);
 }
 requestAnimationFrame(frame);

 document.getElementById('blinkBtn').onclick=blink;
 document.getElementById('followBtn').onclick=e=>{
    follow=!follow; e.currentTarget.classList.toggle('on',follow);
    e.currentTarget.textContent='鼠标跟随：'+(follow?'开':'关');
    if(!follow){tx=ty=0}
 };
 document.getElementById('headBtn').onclick=e=>{
    headFollow=!headFollow; e.currentTarget.classList.toggle('on',headFollow);
    e.currentTarget.textContent='头部轻动：'+(headFollow?'开':'关');
 };
 document.getElementById('resetBtn').onclick=()=>{tx=ty=0;ex=ey=hx=hy=0};
})();
</script>
