出来没有关系；关掉它按钮依旧不出现。"},{content:"运输记录里有一张商品装饰图显示 404。",whySuspicious:'看起来"页面缺了东西"，容易联想到缺的就是按钮。',whyNot:"缺的只是一张角落装饰图；按钮不是图片，是页面结构的一部分，结构里明明找得到它。"}],commonMistakes:["以为网站没做完，按钮根本没写（错：页面结构里明明有）","让老板换个浏览器试试（错：所有浏览器表现都一样）"],tools:["Elements","Console"],fixes:[{plan:"删掉（或注释掉）那条 display:none 样式",grade:"green",description:"对症下药：按钮本来就该在，把藏它的那条规则请走即可，可长期留用。"},{plan:"在页面结构面板里临时勾掉该样式验证猜想",grade:"yellow",description:"能立刻看到按钮回来，但一刷新就失效——只适合用来确认凶手，不算真正修好。"},{plan:"重写整个商品页",grade:"red",description:"大力出奇迹：成本极高，而且没有任何证据表明页面结构坏了，纯属误伤。"}],afterFix:"按钮重新出现在数量选择器下方，点击可以进入下单流程。",difficulty:1,prerequisites:[],teachingIntuition:"看不见 ≠ 不存在，先去页面结构里找找。",source:"人工设计",mutexTags:["css-隐藏元素"],codex:{title:"隐身术",art:"./codex-art-displaynone.png",symptom:"页面上该有的东西凭空消失，但其他地方都正常。",whereToLook:'打开"页面结构"（Elements），找到那个东西的节点——灰色的就是被藏起来的。',howToFix:"找到藏它的那条样式（display:none），删掉或改掉它。",jargon:'行话叫 display:none——"摆在那儿但不许露面"。'}},{id:"BUG-CSS-002",name:"按钮穿了隐形衣",worldWrap:"花房的线上花篮开售，老板说按钮就在那儿，可客人怎么点都没反应。",symptom:"下单按钮明明看得见，颜色字体都正常，可怎么点它都毫无反应，像隔着一层玻璃。",layer:"CSS",rootCause:"一个全透明的遮罩层盖在按钮上方，把所有点击都拦走了。",evidence:[{tool:"现场观察",observation:"鼠标移到按钮上不会变成小手，按钮也没有按下去的感觉。",pointsTo:"点到的可能不是按钮本身",isKey:!1},{tool:"Elements",observation:'用"指向选取"点按钮，选中的却是一层盖在上面的透明区块。',pointsTo:"有个看不见的东西挡在按钮前面",isKey:!0},{tool:"Elements",observation:"这层区块的样式写着 opacity:0，尺寸正好罩住整个商品区。",pointsTo:"透明 ≠ 不挡路，它把点击全接走了",isKey:!1}],redHerrings:[{content:"按钮的样式里写着 cursor:pointer，理论上鼠标该变成小手。",whySuspicious:'样式写着"会变手"却没变，像是样式坏了。',whyNot:"样式本身没坏——是鼠标根本没能碰到按钮，被上面那层透明区块先接住了。"},{content:'运行广播里有一条"脚本加载缓慢"的提示。',whySuspicious:"点不动很容易怀疑是脚本没就位。",whyNot:"脚本早就加载完了；就算把脚本全关掉，透明层照样挡着点击。"}],commonMistakes:["以为按钮的点击程序坏了（错：根本没轮到它接收点击）","以为是电脑鼠标失灵（错：页面上别的东西都能点）"],tools:["Elements","Console"],fixes:[{plan:"删掉那层透明遮罩（或给它加上 pointer-events:none 放行点击）",grade:"green",description:"把挡路的玻璃撤掉，按钮立刻能点，一劳永逸。"},{plan:"把按钮的层级（z-index）抬到遮罩之上",grade:"yellow",description:"按钮能点了，但遮罩还盖着别的区域，迟早再绊一脚。"},{plan:"给页面再加一个浮在最上层的新按钮",grade:"red",description:"叠罗汉式修法：旧按钮还在底下吃灰，页面越来越乱。"}],afterFix:"鼠标移到
