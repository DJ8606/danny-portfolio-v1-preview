<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DANNY ROAD · 本地作品配置器</title><style>
*{box-sizing:border-box}body{font:14px/1.5 system-ui,'Microsoft YaHei';margin:0;background:#0a1324;color:#f6e8d5;padding:30px;max-width:1320px;margin:auto}
h1{font-size:26px;margin:0}p{color:#bdc5d2}.sub{font:11px monospace;letter-spacing:.2em;color:#efb37d}button{background:#34415a;border:1px solid #ffffff43;color:white;border-radius:9px;padding:10px 14px;cursor:pointer}button:hover{background:#4c5770}button.primary{background:#d99c62;color:#111b30;font-weight:700}input,select{width:100%;padding:9px 8px;background:#1b2941;color:#fff;border:1px solid #45566d;border-radius:7px}table{border-collapse:separate;border-spacing:0 8px;width:100%}td,th{text-align:left;padding:5px}th{color:#dcbfa9;font-size:12px}td:first-child{width:100px}td:nth-child(2){min-width:150px}td:nth-child(3){min-width:180px}td:nth-child(4){min-width:220px}.tools{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0}.hint{padding:15px;background:#17243a;border:1px solid #ffffff20;border-radius:9px}code{color:#e8ae74}.radio-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.radiocard{padding:15px;background:#18263c;border-radius:10px}.radiocard label{display:block;margin:6px 0}@media(max-width:850px){body{padding:13px}.scroll{overflow-x:auto}.radio-grid{grid-template-columns:1fr}table{min-width:900px}}
</style><div class="sub">DANNY · ON THE ROAD / LOCAL CONTENT MANAGER</div><h1>本地作品配置器</h1><p>这里只生成配置文件，绝不上传视频。作品数量不限；每个载体可以接多条视频。下载配置后覆盖工程内对应文件即可。</p>
<div class="hint">① 把视频复制到 <code>media/video/</code> ② 在表格填写文件名相对路径 ③ 下载 <code>works.js</code> ④ 覆盖 <code>content/works.js</code> ⑤ 重新打开试玩。已有配置可用下方“导入 works.js”继续编辑。</div>
<div class="tools"><button id="add">＋ 新增作品</button><button id="download" class="primary">↓ 下载 works.js</button><label style="display:inline-flex;gap:6px;align-items:center;cursor:pointer">导入已有 works.js <input id="import" type="file" accept=".js,.json" style="width:220px"></label><span id="status"></span></div>
<div class="scroll"><table><thead><tr><th>作品 ID</th><th>标题</th><th>出现位置</th><th>本地视频路径</th><th>分类</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div>
<h2>电台音乐路径（可选）</h2><p>不填路径仍然有内置合成氛围音乐。生成后覆盖 <code>content/radio.js</code>。</p><div class="radio-grid" id="radios"></div><div class="tools"><button id="download-radio">↓ 下载 radio.js</button></div>
<script>
const portals=[{"id":"sea-balloon","kind":"balloon","at":850,"label":"海上热气球 · 漂浮放映","description":"海湾 · 黄昏"},{"id":"coast-cliff","kind":"cliff","at":1650,"label":"悬崖影院 · 海岸影像","description":"海崖 · 夕阳"},{"id":"tunnel-radio","kind":"tunnel","at":2540,"label":"隧道电台 · 山路影像","description":"海崖 · 隧道"},{"id":"sky-plane","kind":"plane","at":3480,"label":"天空航线 · 空中影像","description":"山林 · 远景"},{"id":"forest-ufo","kind":"ufo","at":4590,"label":"飞碟投影 · 奇想实验","description":"森林 · 光影"},{"id":"rest-stop","kind":"rest","at":5450,"label":"公路休息站 · 旅途影像","description":"林间 · 休息站"},{"id":"lake-window","kind":"window","at":6500,"label":"湖边玻璃窗 · 故事影像","description":"湖畔 · 建筑"},{"id":"lake-cinema","kind":"cinema","at":7410,"label":"露天影院 · 湖畔放映","description":"小镇 · 夜幕"},{"id":"scenic-town","kind":"native","at":10350,"label":"山间小镇 · 场景发现","description":"山间小镇 · 原画放映点"},{"id":"scenic-city","kind":"native","at":10990,"label":"湾岸夜城 · 场景发现","description":"湾岸夜城 · 原画放映点"},{"id":"scenic-raincity","kind":"native","at":13790,"label":"雨夜霓虹 · 场景发现","description":"雨夜霓虹 · 原画放映点"},{"id":"scenic-coast","kind":"native","at":14400,"label":"夕阳海岸 · 场景发现","description":"夕阳海岸 · 原画放映点"},{"id":"scenic-desert","kind":"native","at":17180,"label":"沙漠落日 · 场景发现","description":"沙漠落日 · 原画放映点"},{"id":"scenic-tunnel","kind":"native","at":17980,"label":"海崖隧道 · 场景发现","description":"海崖隧道 · 原画放映点"},{"id":"scenic-forest","kind":"native","at":19520,"label":"森林山道 · 场景发现","description":"森林山道 · 原画放映点"},{"id":"scenic-lake","kind":"native","at":22330,"label":"清晨湖畔 · 场景发现","description":"清晨湖畔 · 原画放映点"},{"id":"scenic-sakura","kind":"native","at":24040,"label":"樱花山湖 · 场景发现","description":"樱花山湖 · 原画放映点"},{"id":"scenic-snow","kind":"native","at":25720,"label":"雪山公路 · 场景发现","description":"雪山公路 · 原画放映点"}];
const defaultWorks=[{"id":"film-001","title":"01 · 海上的第一幕","portal":"sea-balloon","file":"","poster":"","category":"品牌视频"},{"id":"film-002","title":"02 · 海崖的故事","portal":"coast-cliff","file":"","poster":"","category":"插画动画"},{"id":"film-003","title":"03 · 穿越隧道","portal":"tunnel-radio","file":"","poster":"","category":"短片"},{"id":"film-004","title":"04 · 天空航线","portal":"sky-plane","file":"","poster":"","category":"广告视频"},{"id":"film-005","title":"05 · 来自宇宙的信","portal":"forest-ufo","file":"","poster":"","category":"AI实验"},{"id":"film-006","title":"06 · 停靠片刻","portal":"rest-stop","file":"","poster":"","category":"记录"},{"id":"film-007","title":"07 · 湖边来信","portal":"lake-window","file":"","poster":"","category":"个人创作"},{"id":"film-008","title":"08 · 露天首映","portal":"lake-cinema","file":"","poster":"","category":"精选作品"},{"id":"film-009","title":"09 · 山间小镇的影像","portal":"scenic-town","file":"","poster":"","category":"风景短片"},{"id":"film-010","title":"10 · 湾岸夜城的影像","portal":"scenic-city","file":"","poster":"","category":"风景短片"},{"id":"film-011","title":"11 · 雨夜霓虹的影像","portal":"scenic-raincity","file":"","poster":"","category":"风景短片"},{"id":"film-012","title":"12 · 夕阳海岸的影像","portal":"scenic-coast","file":"","poster":"","category":"风景短片"},{"id":"film-013","title":"13 · 沙漠落日的影像","portal":"scenic-desert","file":"","poster":"","category":"风景短片"},{"id":"film-014","title":"14 · 海崖隧道的影像","portal":"scenic-tunnel","file":"","poster":"","category":"风景短片"},{"id":"film-015","title":"15 · 森林山道的影像","portal":"scenic-forest","file":"","poster":"","category":"风景短片"},{"id":"film-016","title":"16 · 清晨湖畔的影像","portal":"scenic-lake","file":"","poster":"","category":"风景短片"},{"id":"film-017","title":"17 · 樱花山湖的影像","portal":"scenic-sakura","file":"","poster":"","category":"风景短片"},{"id":"film-018","title":"18 · 雪山公路的影像","portal":"scenic-snow","file":"","poster":"","category":"风景短片"}];
const defaultRadio=[{"id": "sunset", "name": "SUNSET FM", "chord": [220, 261.63, 329.63, 440], "file": ""}, {"id": "forest", "name": "FOREST AIR", "chord": [196, 246.94, 293.66, 392], "file": ""}, {"id": "night", "name": "NIGHT ROUTE", "chord": [174.61, 220, 261.63, 349.23], "file": ""}];
let works=structuredClone(defaultWorks),radio=structuredClone(defaultRadio);
const $=s=>document.querySelector(s);
const make=(tag,attributes={})=>{let el=document.createElement(tag);Object.assign(el,attributes);return el;};
function cell(el){const td=make('td');td.append(el);return td;}
function render(){const host=$('#tbody');host.replaceChildren();works.forEach((w,i)=>{
 const tr=make('tr');const input=(key,ph)=>{let el=make('input',{value:w[key]||'',placeholder:ph});el.oninput=()=>w[key]=el.value;return el;};
 const select=make('select');for(let p of portals){let o=make('option',{value:p.id,textContent:p.label});select.append(o);}select.value=w.portal||portals[0].id;w.portal=select.value;select.onchange=()=>w.portal=select.value;
 const del=make('button',{textContent:'删除'});del.onclick=()=>{works.splice(i,1);render();};
 tr.append(cell(input('id','film-009')),cell(input('title','我的新视频')),cell(select),cell(input('file','media/video/myfilm.mp4')),cell(input('category','创作')),cell(del));host.append(tr);
 });$('#status').textContent=`共 ${works.length} 部作品`;
}
function renderRadio(){const host=$('#radios');host.replaceChildren();radio.forEach((r,i)=>{
 const c=make('div',{className:'radiocard'});c.append(make('strong',{textContent:r.name}));
 const l=make('label',{textContent:'歌曲文件相对路径（MP3 / OGG）'}),inp=make('input',{value:r.file||'',placeholder:'media/audio/music-'+(i+1)+'.mp3'});
 inp.oninput=()=>r.file=inp.value;c.append(l,inp);host.append(c);
 });}
function exportFile(name,content){let url=URL.createObjectURL(new Blob([content],{type:'application/javascript;charset=utf-8'}));let a=make('a',{href:url,download:name});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);}
$('#add').onclick=()=>{works.push({id:'film-'+String(works.length+1).padStart(3,'0'),title:'新视频',portal:portals[works.length%portals.length].id,file:'',category:'作品'});render();};
$('#download').onclick=()=>{const ids=works.map(w=>w.id);if(ids.some(x=>!x)||new Set(ids).size!==ids.length){alert('作品 ID 不可为空或重复');return;}
 exportFile('works.js','window.DANNY_WORKS = '+JSON.stringify(works,null,2)+';\n');};
$('#download-radio').onclick=()=>exportFile('radio.js','window.DANNY_RADIOS = '+JSON.stringify(radio,null,2)+';\n');
$('#import').onchange=async e=>{const file=e.target.files[0];if(!file)return;const content=await file.text();try{
 const match=content.match(/window\.DANNY_WORKS\s*=\s*(\[[\s\S]*?\])\s*;/);
 const rows=JSON.parse(match?match[1]:content);if(!Array.isArray(rows))throw Error('不是作品数组');works=rows;render();
 }catch(err){alert('导入失败，请选择本工程的 content/works.js：'+err.message)}e.target.value='';};
render();renderRadio();
</script></html>
